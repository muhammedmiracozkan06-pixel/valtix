```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valtix | Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #111827;

            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            width: 600px;
            height: 600px;
            background: #dbeafe;
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.6;
            top: -250px;
            right: -200px;
        }

        .background2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: #e0e7ff;
            filter: blur(120px);
            border-radius: 50%;
            bottom: -250px;
            left: -200px;
            opacity: 0.6;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 850px;
            text-align: center;
            padding: 50px 30px;
        }

        .cloud {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 56px;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #4f46e5;
        }

        .subtitle {
            max-width: 680px;
            margin: auto;
            font-size: 20px;
            line-height: 1.7;
            color: #6b7280;
        }

        .coming {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #374151;
        }

        .languages {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .languages button {
            border: 1px solid #e5e7eb;
            background: white;
            padding: 9px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .languages button:hover,
        .languages button.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .powered {
            margin-top: 55px;

        @media (max-width: 600px) {

            }

    </style>
</head>

<body>

    <div class="background"></div>
    <div class="background2"></div>

    <main class="container">

        <div class="cloud">☁️</div>

        <div class="badge" id="badge">
            YAKINDA
        </div>

        <h1>
            <span>Valtix</span> Yakında Sizlerle!
        </h1>

        <p class="subtitle" id="subtitle">
            Yeni nesil cloud deneyimi için hazırlanıyoruz.
            Valtix çok yakında sizlerle olacak.
        </p>

        <p class="coming" id="coming">
            🚀 Büyük şeyler bulutta şekilleniyor.
        </p>

        <div class="languages">
            <button class="active" onclick="setLanguage('tr')">🇹🇷 Türkçe</button>
            <button onclick="setLanguage('en')">🇬🇧 English</button>
            <button onclick="setLanguage('de')">🇩🇪 Deutsch</button>
        </div>

        <div class="powered">
            Powered by <strong>WindDevelopers</strong>
        </div>

    </main>

    <script>
        const translations = {
            tr: {
                title: "<span>Valtix</span> Yakında Sizlerle!",
                badge: "YAKINDA",
                subtitle: "Yeni nesil cloud deneyimi için hazırlanıyoruz. Valtix çok yakında sizlerle olacak.",
                coming: "🚀 Büyük şeyler bulutta şekilleniyor.",
                htmlLang: "tr"
            },

            en: {
                title: "<span>Valtix</span> is Coming Soon!",
                badge: "COMING SOON",
                subtitle: "We are preparing a next-generation cloud experience. Valtix is coming soon.",
                coming: "🚀 Big things are taking shape in the cloud.",
                htmlLang: "en"
            },

            de: {
                title: "<span>Valtix</span> kommt bald!",
                badge: "DEMNÄCHST",
                subtitle: "Wir bereiten ein Cloud-Erlebnis der nächsten Generation vor. Valtix kommt bald.",
                coming: "🚀 Große Dinge entstehen in der Cloud.",
                htmlLang: "de"
            }
        };

        function setLanguage(language) {
            const t = translations[language];

            document.querySelector("h1").innerHTML = t.title;
            document.getElementById("badge").textContent = t.badge;
            document.getElementById("subtitle").textContent = t.subtitle;
            document.getElementById("coming").textContent = t.coming;

            document.documentElement.lang = t.htmlLang;

            document.querySelectorAll(".languages button")
                .forEach(button => button.classList.remove("active"));

            event.target.classList.add("active");

            document.title = "Valtix | " + t.badge;
        }
    </script>

</body>
</html>
