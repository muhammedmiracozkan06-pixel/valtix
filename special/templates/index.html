<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        .badge {
            background-color: #1e293b;
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid #334155;
            display: inline-block;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">
            <span class="status-dot"></span>Under Construction
        </div>
        <h1>Our Wiki is Coming Soon!</h1>
        <p>We are currently working hard behind the scenes to build a comprehensive knowledge hub. Stay tuned for updates!</p>
    </div>

</body>
</html>
